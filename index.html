<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#dcecf0">
    <title>ぺんぎん哲学 — 氷の上のひとこと</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        color: #233844;
        background: #eaf3f3;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --ink: #233844;
        --muted: #71858d;
        --deep: #164b5c;
        --sea: #91c6d0;
        --mint: #d7eee9;
        --paper: #fffefa;
      }

      * { box-sizing: border-box; }
      body { min-width: 0; min-height: 100svh; margin: 0; }
      button { color: inherit; font: inherit; }
      button:focus-visible { outline: 3px solid #f3a979; outline-offset: 3px; }

      .page {
        display: grid;
        grid-template-columns: minmax(190px, 1fr) minmax(320px, 430px) minmax(190px, 1fr);
        gap: clamp(24px, 5vw, 82px);
        align-items: center;
        width: min(1440px, 100%);
        min-height: 100svh;
        margin: 0 auto;
        padding: 92px 48px 44px;
      }

      .brand {
        position: fixed;
        z-index: 5;
        top: 64px;
        left: max(28px, calc((100vw - 1344px) / 2));
        display: flex;
        gap: 10px;
        align-items: center;
        color: var(--deep);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .12em;
      }
      .brand-mark {
        display: grid;
        width: 31px;
        height: 31px;
        place-items: center;
        border: 1px solid #a6c8c8;
        border-radius: 50%;
        background: #f7fbf8;
        font-size: 17px;
      }

      .intro { align-self: center; padding-top: 12px; }
      .eyebrow {
        color: #5b9095;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .2em;
      }
      .intro h1 {
        margin: 20px 0 15px;
        color: var(--deep);
        font-size: clamp(34px, 4vw, 56px);
        font-weight: 700;
        letter-spacing: -.08em;
        line-height: 1.24;
      }
      .intro p {
        max-width: 285px;
        color: var(--muted);
        font-size: 13px;
        line-height: 2;
      }
      .side-note {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        max-width: 280px;
        margin-top: 36px;
        padding-top: 17px;
        border-top: 1px solid #cfdfdf;
        color: #70858a;
        font-size: 11px;
        line-height: 1.8;
      }
      .side-note span { color: #72a5a4; font-size: 17px; }

      .game { width: 100%; }
      .scene {
        position: relative;
        height: min(690px, 76svh);
        min-height: 570px;
        overflow: hidden;
        border: 7px solid #f8fbf8;
        border-radius: 220px 220px 30px 30px;
        background:
          radial-gradient(ellipse at 50% 63%, rgb(230 248 246 / 66%) 0 21%, transparent 58%),
          linear-gradient(180deg, #9fcbd1 0%, #c2e0dc 49%, #dcebe3 73%, #b6dadd 100%);
        box-shadow: 0 24px 70px rgb(52 104 117 / 14%), inset 0 0 0 1px rgb(255 255 255 / 80%);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .scene::before {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 46%;
        background: linear-gradient(180deg, rgb(255 255 255 / 21%), transparent);
        content: "";
        pointer-events: none;
      }
      .aurora {
        position: absolute;
        top: 8%;
        left: 5%;
        width: 90%;
        height: 38%;
        border-radius: 50%;
        background: linear-gradient(115deg, transparent 26%, rgb(206 243 222 / 36%) 47%, rgb(238 250 231 / 21%) 56%, transparent 72%);
        filter: blur(17px);
        transform: rotate(-12deg);
        animation: aurora-drift 12s ease-in-out infinite alternate;
      }
      @keyframes aurora-drift {
        from { transform: translateX(-4%) rotate(-12deg); opacity: .7; }
        to { transform: translateX(4%) rotate(-4deg); opacity: 1; }
      }
      .sun {
        position: absolute;
        top: 16%;
        right: 20%;
        width: 48px;
        height: 48px;
        border: 1px solid rgb(255 255 255 / 55%);
        border-radius: 50%;
        background: rgb(255 250 221 / 68%);
        box-shadow: 0 0 35px rgb(255 251 215 / 55%);
      }
      .distant-ice {
        position: absolute;
        top: 47%;
        width: 155px;
        height: 32px;
        border: 1px solid rgb(255 255 255 / 70%);
        border-radius: 50%;
        background: linear-gradient(180deg, #f8ffff, #c3e3e5);
        box-shadow: 0 7px 0 rgb(114 178 189 / 20%);
        opacity: .75;
      }
      .distant-ice.left { left: -44px; transform: rotate(-5deg); }
      .distant-ice.right { right: -43px; top: 43%; transform: rotate(7deg) scale(.75); }
      .cloud {
        position: absolute;
        top: 27%;
        left: 11%;
        width: 63px;
        height: 18px;
        border-radius: 50%;
        background: rgb(250 255 249 / 44%);
        filter: blur(2px);
      }
      .cloud::before, .cloud::after {
        position: absolute;
        bottom: 3px;
        border-radius: 50%;
        background: inherit;
        content: "";
      }
      .cloud::before { left: 12px; width: 27px; height: 27px; }
      .cloud::after { right: 8px; width: 20px; height: 20px; }

      .scene-top {
        position: absolute;
        z-index: 2;
        top: 28px;
        right: 26px;
        left: 26px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .weather-pill, .count-pill {
        display: flex;
        gap: 7px;
        align-items: center;
        min-height: 31px;
        padding: 7px 11px;
        border: 1px solid rgb(255 255 255 / 62%);
        border-radius: 22px;
        background: rgb(247 253 248 / 55%);
        color: #315a62;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .04em;
        backdrop-filter: blur(10px);
      }
      .weather-dot { width: 7px; height: 7px; border-radius: 50%; background: #9cbe91; }

      .iceberg {
        position: absolute;
        right: -22%;
        bottom: 4%;
        left: -22%;
        height: 35%;
        border: 1px solid rgb(255 255 255 / 91%);
        border-radius: 50% 48% 0 0 / 23% 24% 0 0;
        background: linear-gradient(180deg, #f9fffc 0%, #e8f7f3 44%, #bddfe1 100%);
        box-shadow: 0 -12px 28px rgb(255 255 255 / 53%), inset 0 -8px 18px rgb(132 190 195 / 19%);
        transform: rotate(-2deg);
      }
      .iceberg::before {
        position: absolute;
        top: 22%;
        left: 17%;
        width: 66%;
        height: 18%;
        border-radius: 50%;
        background: rgb(255 255 255 / 68%);
        content: "";
        filter: blur(10px);
      }
      .ice-crack {
        position: absolute;
        z-index: 1;
        bottom: 15%;
        left: 24%;
        width: 23%;
        height: 30px;
        border-top: 1px solid rgb(112 171 182 / 33%);
        border-radius: 50%;
        transform: rotate(-7deg);
      }
      .ice-crack.two { right: 19%; bottom: 10%; left: auto; width: 18%; transform: rotate(8deg); }
      .penguin {
        position: absolute;
        z-index: 3;
        bottom: 22%;
        left: 50%;
        width: 172px;
        height: 220px;
        transform: translateX(-50%);
        transition: left 360ms cubic-bezier(.2,.8,.2,1), filter 220ms ease;
        animation: bob 3.2s ease-in-out infinite;
        pointer-events: none;
        filter: drop-shadow(0 11px 9px rgb(37 83 90 / 15%));
      }
      @keyframes bob {
        0%, 100% { margin-bottom: 0; }
        50% { margin-bottom: 7px; }
      }
      .penguin svg { width: 100%; height: 100%; overflow: visible; }
      .penguin.wiggle { animation: wiggle 500ms ease-in-out, bob 3.2s ease-in-out infinite 500ms; }
      @keyframes wiggle {
        0%, 100% { rotate: 0deg; }
        20% { rotate: -9deg; }
        45% { rotate: 7deg; }
        70% { rotate: -4deg; }
      }
      .penguin.philosopher { bottom: 15%; filter: drop-shadow(0 0 19px rgb(255 238 175 / 91%)); }
      .penguin.philosopher::after {
        position: absolute;
        top: 15%;
        right: 7%;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: #fff8cc;
        box-shadow: 0 0 24px 9px rgb(255 239 174 / 68%);
        content: "";
      }
      .cry-bubble {
        position: absolute;
        z-index: 4;
        bottom: 100%;
        left: 50%;
        width: max-content;
        max-width: calc(100vw - 110px);
        padding: 10px 18px;
        border: 2px solid #31545a;
        border-radius: 22px 22px 22px 7px;
        background: #fffefa;
        color: #265462;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: .04em;
        box-shadow: 3px 4px 0 rgb(49 84 90 / 14%), 0 8px 24px rgb(46 101 110 / 13%);
        transform: translateX(calc(-50% + var(--bubble-shift, 0px))) translateY(8px) scale(.9);
        opacity: 0;
        transition: opacity 180ms ease, transform 360ms cubic-bezier(.2,.8,.2,1);
        pointer-events: none;
      }
      .cry-bubble::after {
        position: absolute;
        top: calc(100% - 1px);
        left: calc(50% - 7px + 6px - var(--bubble-shift, 0px));
        width: 14px;
        height: 78px;
        background: #fffefa;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        filter: drop-shadow(1px 2px 0 #31545a);
        content: "";
      }
      .cry-bubble.show { transform: translateX(calc(-50% + var(--bubble-shift, 0px))) translateY(0) scale(1); opacity: 1; }
      .cry-bubble.philosophy-bubble {
        bottom: 100%;
        width: min(86vw, 340px);
        max-width: calc(100vw - 110px);
        padding: 10px 15px;
        border-radius: 22px 22px 8px 22px;
        font-size: 14px;
        line-height: 1.55;
        letter-spacing: 0;
        text-align: center;
      }
      .cry-bubble.philosophy-bubble::after {
        right: auto;
        left: calc(50% - 8px + 6px - var(--bubble-shift, 0px));
        width: 17px;
        height: 78px;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
      }
      .swipe-hint {
        position: absolute;
        z-index: 2;
        right: 0;
        bottom: 8%;
        left: 0;
        color: #6b9296;
        font-size: 10px;
        letter-spacing: .16em;
        text-align: center;
        pointer-events: none;
      }
      .swipe-hint span { display: inline-block; margin-right: 7px; font-size: 14px; vertical-align: -1px; }
      .swipe-flash {
        position: absolute;
        z-index: 2;
        top: 54%;
        left: 50%;
        width: 10px;
        height: 10px;
        border: 1px solid rgb(255 255 255 / 90%);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }
      .swipe-flash.show { animation: ripple 600ms ease-out; }
      @keyframes ripple {
        from { width: 10px; height: 10px; opacity: .8; transform: translate(-50%, -50%); }
        to { width: 180px; height: 180px; opacity: 0; transform: translate(-50%, -50%); }
      }

      .game-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 18px 5px 0;
      }
      .interaction-count { color: var(--muted); font-size: 11px; }
      .interaction-count strong { margin-left: 4px; color: var(--deep); font-size: 14px; }
      .control-buttons { display: flex; gap: 8px; }
      .sound-button, .pet-button {
        min-height: 42px;
        padding: 0 15px;
        border: 1px solid #c5dada;
        border-radius: 24px;
        background: rgb(255 255 255 / 63%);
        color: #376573;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 140ms ease, background 140ms ease;
      }
      .sound-button:active, .pet-button:active { transform: scale(.96); }
      .pet-button { border-color: #3c7f88; background: #3c7f88; color: white; }

      .aside { align-self: center; justify-self: end; max-width: 255px; padding-top: 30px; }
      .aside-mark { color: #8db4ae; font-size: 27px; }
      .aside h2 { margin: 12px 0 10px; color: #43636a; font-size: 14px; }
      .aside p { margin: 0; color: #829398; font-size: 11px; line-height: 1.9; }
      .aside-tip { margin-top: 25px !important; padding: 13px 15px; border-left: 2px solid #9fc5bd; background: rgb(255 255 255 / 45%); }

      @media (max-width: 940px) {
        .page { grid-template-columns: minmax(0, 430px); justify-content: center; padding: 80px 24px 40px; }
        .intro, .aside { display: none; }
        .brand { top: 18px; left: 22px; }
        .scene { height: min(690px, 72svh); min-height: 510px; }
      }
      @media (max-width: 480px) {
        body { background: #e8f1ef; }
        .page { display: block; min-height: 100svh; padding: 62px 13px max(24px, env(safe-area-inset-bottom)); }
        .brand { top: 13px; left: 17px; font-size: 11px; }
        .brand-mark { width: 27px; height: 27px; font-size: 15px; }
        .scene {
          height: min(610px, 68svh);
          min-height: 440px;
          border-width: 5px;
          border-radius: 170px 170px 24px 24px;
        }
        .scene-top { top: 62px; right: 18px; left: 18px; }
        .penguin { bottom: 22%; width: 152px; height: 195px; }
        .cry-bubble { bottom: 53%; font-size: 18px; }
        .game-controls { padding: 13px 3px 0; }
        .interaction-count { font-size: 10px; }
        .sound-button, .pet-button { min-height: 40px; padding: 0 12px; font-size: 10px; }
      }
      @media (max-height: 700px) and (max-width: 940px) {
        .scene { height: 520px; min-height: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <header class="brand" aria-label="ぺんぎん哲学">
      <span class="brand-mark" aria-hidden="true">氷</span>
      <span>ぺんぎん哲学</span>
    </header>

    <main class="page">
      <section class="intro" aria-label="ゲームの説明">
        <div class="eyebrow">A LITTLE MOMENT ON THE ICE</div>
        <h1>氷の上で、<br>ひとやすみ。</h1>
        <p>小さな氷の上で暮らすペンギンを、そっとスワイプしてみてください。いつもはかわいい声で返事をします。</p>
        <div class="side-note"><span aria-hidden="true">✳</span><span>百回目のなでなでで、ペンギンが哲学をひとこと話します。</span></div>
      </section>

      <section class="game" aria-label="ペンギンと遊ぶ">
        <div class="scene" id="scene" role="application" aria-label="氷の上のペンギン。画面をスワイプしてください">
          <div class="aurora" aria-hidden="true"></div>
          <div class="sun" aria-hidden="true"></div>
          <div class="cloud" aria-hidden="true"></div>
          <div class="distant-ice left" aria-hidden="true"></div>
          <div class="distant-ice right" aria-hidden="true"></div>

          <div class="scene-top">
            <div class="weather-pill"><span class="weather-dot"></span>南極の小さな氷</div>
            <div class="count-pill" aria-label="スワイプ回数"><span aria-hidden="true">❄</span><span id="swipe-count">0</span></div>
          </div>

          <div class="iceberg" aria-hidden="true"></div>
          <div class="ice-crack" aria-hidden="true"></div>
          <div class="ice-crack two" aria-hidden="true"></div>
          <div class="swipe-flash" id="swipe-flash" aria-hidden="true"></div>

          <div class="penguin" id="penguin">
            <svg viewBox="0 0 180 230" role="img" aria-label="ペンギン">
              <ellipse cx="92" cy="214" rx="50" ry="9" fill="#9fc6c5" opacity=".34"/>
              <path d="M56 185c-7 12-9 22-4 26 6 5 20 1 32-6l9-12zM103 192c8 12 20 20 28 17 7-3 3-14-2-24l-17-7z" fill="#edaa68"/>
              <path d="M45 107c-5-42 12-76 42-83 34-8 62 22 63 65l3 62c1 31-23 51-59 51-37 0-58-20-56-51z" fill="#20343b"/>
              <path d="M69 114c1-26 13-43 29-43 18 0 32 19 33 46l1 31c0 21-14 37-34 37-22 0-34-15-33-36z" fill="#f8f6e8"/>
              <path d="M50 95c-17 11-27 31-23 56 2 11 8 15 15 10l16-15z" fill="#20343b"/>
              <path d="M143 94c17 10 27 30 23 54-2 12-8 16-15 11l-16-15z" fill="#20343b"/>
              <ellipse cx="74" cy="66" rx="9" ry="11" fill="#fffdf3"/>
              <ellipse cx="119" cy="66" rx="9" ry="11" fill="#fffdf3"/>
              <circle cx="77" cy="68" r="4" fill="#172b31"/>
              <circle cx="116" cy="68" r="4" fill="#172b31"/>
              <path d="M85 84c4-8 18-8 23 0l-11 13z" fill="#efa750"/>
              <path d="M67 52c6-5 13-6 19-4M108 48c7-2 14 0 19 5" fill="none" stroke="#15272d" stroke-width="4" stroke-linecap="round"/>
              <path d="M71 106c7 5 15 7 24 6M109 112c7 0 13-2 18-6" fill="none" stroke="#e9e5d7" stroke-width="2" opacity=".75"/>
            </svg>
            <div class="cry-bubble" id="cry-bubble" role="status" aria-live="polite">
              <span id="cry-text"></span>
            </div>
          </div>

          <div class="swipe-hint"><span aria-hidden="true">↔</span>画面をスワイプしてみよう</div>
        </div>

        <div class="game-controls">
          <div class="interaction-count">なでた回数<strong id="count-label">0</strong></div>
          <div class="control-buttons">
            <button class="sound-button" id="sound-button" type="button" aria-pressed="false">♪ 音 OFF</button>
            <button class="pet-button" id="pet-button" type="button">なでる</button>
          </div>
        </div>

      </section>

      <aside class="aside" aria-label="遊び方">
        <div class="aside-mark" aria-hidden="true">〰</div>
        <h2>気ままに、ひとすべり。</h2>
        <p>左右でも上下でも、好きな方向へスワイプ。ペンギンはちょっと移動して、ひらがなの声で返事をします。</p>
        <p class="aside-tip">百回ごとに、いつもと違う話が聞けるかもしれません。急がず、のんびり。</p>
      </aside>
    </main>

    <script>
      (() => {
        const scene = document.getElementById("scene");
        const penguin = document.getElementById("penguin");
        const bubble = document.getElementById("cry-bubble");
        const cryText = document.getElementById("cry-text");
        const countLabel = document.getElementById("count-label");
        const swipeCount = document.getElementById("swipe-count");
        const flash = document.getElementById("swipe-flash");
        const soundButton = document.getElementById("sound-button");
        const petButton = document.getElementById("pet-button");

        const cries = ["ぺーん。", "ぺんっ！", "ぺぎゃ。", "ぺるる。", "ぺんぺん。", "ぷぅ。", "ぺぇ。", "きゅう。"];
        const thoughts = [
          "考えずに進めば、足跡は増えても行き先は見えない。考えるだけで歩かなければ、景色はひとつも変わらない。",
          "目に見えるものだけを信じると、心の動きを見失う。心の声だけを信じると、目の前の景色を見落とす。",
          "自分で選べない波は止められない。でも、どの波に乗るかは選べる。",
          "答えを急ぐと、問いのなかに隠れていた小さな発見を取りこぼす。",
          "昨日の自分と比べれば、進んだ歩幅が見える。誰かと比べれば、自分の歩幅を忘れてしまう。",
          "ひとりで考えると自分の声が聞こえる。誰かと話すと、その声が世界のなかで形を変える。",
          "知っていることが増えるほど、知らないことの広さにも気づいていく。",
          "自由に泳ぐとは、どこへでも行くことではない。行き先を自分で選ぶことだ。",
          "失ったものを数える目は、まだここにあるものを見えにくくする。",
          "正しさだけでは心に届かない。やさしさだけでは道に迷うこともある。",
          "静けさは空っぽではない。耳をすませば、波の考えが聞こえてくる。",
          "遠くを見る目と、足元を見る目。その両方があって、ぼくは迷わず歩ける。"
        ];

        let swipes = 0;
        let position = 50;
        let soundEnabled = false;
        let thoughtOrder = [];
        let lastThoughtIndex = -1;
        let bubbleTimer;
        let audioContext;
        let pointerStart = null;

        function chirp() {
          if (!soundEnabled) return;
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!audioContext) audioContext = new AudioContextClass();
          if (audioContext.state === "suspended") audioContext.resume();

          const now = audioContext.currentTime;
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(660, now);
          oscillator.frequency.exponentialRampToValueAtTime(990, now + 0.09);
          oscillator.frequency.exponentialRampToValueAtTime(560, now + 0.26);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.12, now + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.31);
        }

        function showCry(text, isPhilosophy = false) {
          bubble.classList.toggle("philosophy-bubble", isPhilosophy);
          penguin.classList.toggle("philosopher", isPhilosophy);
          cryText.textContent = text;
          bubble.classList.add("show");
          updateBubbleOffset();
          window.clearTimeout(bubbleTimer);
          if (!isPhilosophy) {
            bubbleTimer = window.setTimeout(() => bubble.classList.remove("show"), 1150);
          }
          penguin.classList.remove("wiggle");
          void penguin.offsetWidth;
          penguin.classList.add("wiggle");
          chirp();
        }

        function updateBubbleOffset() {
          if (!bubble.classList.contains("show")) return;
          const sceneWidth = scene.clientWidth;
          const bubbleWidth = bubble.getBoundingClientRect().width;
          const penguinCenter = scene.clientLeft + sceneWidth * position / 100;
          const minCenter = bubbleWidth / 2 + 18;
          const maxCenter = scene.clientLeft + sceneWidth - bubbleWidth / 2 - 18;
          const visibleCenter = Math.max(minCenter, Math.min(maxCenter, penguinCenter));
          bubble.style.setProperty("--bubble-shift", `${visibleCenter - penguinCenter}px`);
        }

        function showThought() {
          if (thoughtOrder.length === 0) {
            thoughtOrder = thoughts.map((_, index) => index);
            for (let index = thoughtOrder.length - 1; index > 0; index -= 1) {
              const swapIndex = Math.floor(Math.random() * (index + 1));
              [thoughtOrder[index], thoughtOrder[swapIndex]] = [thoughtOrder[swapIndex], thoughtOrder[index]];
            }
            if (thoughtOrder.length > 1 && thoughtOrder[0] === lastThoughtIndex) {
              [thoughtOrder[0], thoughtOrder[1]] = [thoughtOrder[1], thoughtOrder[0]];
            }
          }
          lastThoughtIndex = thoughtOrder.shift();
          penguin.classList.add("philosopher");
          showCry(thoughts[lastThoughtIndex], true);
        }

        function interact(deltaX) {
          swipes += 1;
          countLabel.textContent = String(swipes);
          swipeCount.textContent = String(swipes);

          if (Math.abs(deltaX) > 10) {
            position = Math.max(28, Math.min(72, position + (deltaX > 0 ? 9 : -9)));
            penguin.style.left = `${position}%`;
          }

          flash.classList.remove("show");
          void flash.offsetWidth;
          flash.classList.add("show");

          if (swipes % 100 === 0) {
            showThought();
            return;
          }
          showCry(cries[Math.floor(Math.random() * cries.length)]);
        }

        scene.addEventListener("pointerdown", (event) => {
          if (event.target.closest("button")) return;
          pointerStart = { x: event.clientX, y: event.clientY };
          scene.setPointerCapture(event.pointerId);
        });

        scene.addEventListener("pointerup", (event) => {
          if (!pointerStart) return;
          const deltaX = event.clientX - pointerStart.x;
          const deltaY = event.clientY - pointerStart.y;
          pointerStart = null;
          if (Math.hypot(deltaX, deltaY) >= 18) interact(deltaX);
        });

        scene.addEventListener("pointercancel", () => { pointerStart = null; });
        petButton.addEventListener("click", () => interact(0));
        soundButton.addEventListener("click", () => {
          soundEnabled = !soundEnabled;
          soundButton.setAttribute("aria-pressed", String(soundEnabled));
          soundButton.textContent = soundEnabled ? "♪ 音 ON" : "♪ 音 OFF";
          if (soundEnabled) chirp();
        });
        window.addEventListener("resize", updateBubbleOffset);
        document.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft" || event.key === "ArrowRight" || event.key === " ") {
            if (event.target instanceof HTMLButtonElement) return;
            event.preventDefault();
            interact(event.key === "ArrowLeft" ? -30 : event.key === "ArrowRight" ? 30 : 0);
          }
        });
      })();
    </script>
  </body>
</html>
